version: '3'

vars:
  NIX_FILES:
    sh: git ls-files --cached --others --exclude-standard '*.nix' | tr '\n' ' '

tasks:
  default:
    desc: Run all checks
    cmds:
      - task: ci

  fmt:
    desc: Format Nix files
    cmds:
      - nixfmt {{.NIX_FILES}}

  lint:
    desc: Check Nix formatting
    cmds:
      - nixfmt --check {{.NIX_FILES}}

  test:
    desc: Evaluate the flake and build its checks
    cmds:
      - nix flake check

  ci:
    desc: Run formatting and flake checks
    cmds:
      - task: lint
      - task: test
